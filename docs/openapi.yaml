openapi: 3.0.3
info:
  title: Change API
  version: 1.0.0
  description: |
    Execute a change request on a given project and branch. Returns logs from the change engine.
servers:
  - url: http://localhost:5000
paths:
  /projects/{projectId}/branches/{branchId}/change:
    post:
      operationId: executeChange
      tags:
        - Change
      summary: Execute a change request
      description: |
        Accepts a JSON body with change_request and invokes the change engine.
        Returns logs and propagates the status code from the engine. If change_request
        is missing, returns 400 with an error message.
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
        - name: branchId
          in: path
          required: true
          description: Branch identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
            examples:
              stringChangeRequest:
                summary: String change request
                value:
                  change_request: "Rename element X to Y"
              objectChangeRequest:
                summary: Object change request
                value:
                  change_request:
                    action: "rename"
                    targetId: "elem-123"
                    params:
                      newName: "NewElementName"
      responses:
        '200':
          description: Change executed successfully; logs returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsResponse'
              examples:
                success:
                  value:
                    logs:
                      - "Starting change engine..."
                      - "Applied change successfully."
        '400':
          description: Invalid request; missing change_request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingChangeRequest:
                  value:
                    error: "Invalid request. Missing change_request."
        default:
          description: Response returned by the change engine (status code varies); logs included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsResponse'

  /projects/{projectId}/branches/{branchId}/context:
    post:
      operationId: getContext
      tags:
        - Context
      summary: Retrieve context for a request
      description: |
        Accepts a JSON body with context_request and returns the prepared context
        without running the change engine.
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
        - name: branchId
          in: path
          required: true
          description: Branch identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextRequest'
            examples:
              stringContextRequest:
                summary: String context request
                value:
                  context_request: "Explain the propulsion subsystem"
      responses:
        '200':
          description: Context retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
              examples:
                success:
                  value:
                    status: "success"
                    context:
                      - "{\"@id\": \"elem-1\", \"name\": \"Subsystem\"}"
        '400':
          description: Invalid request; missing context_request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingContextRequest:
                  value:
                    error: "Invalid request. Missing context_request."
        '500':
          description: Unexpected error while building context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ChangeRequest:
      type: object
      required:
        - change_request
      properties:
        change_request:
          description: The change request payload passed to the engine.
          oneOf:
            - type: string
            - type: object
    ContextRequest:
      type: object
      required:
        - context_request
      properties:
        context_request:
          description: The request payload used to build context.
          oneOf:
            - type: string
            - type: object
    LogsResponse:
      type: object
      required:
        - logs
      properties:
        logs:
          description: Ordered log messages from the change engine.
          type: array
          items:
            type: string
    ContextResponse:
      type: object
      required:
        - status
        - context
      properties:
        status:
          type: string
          description: Request status.
        context:
          description: Prepared context entries from the model.
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message